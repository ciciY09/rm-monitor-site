<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RM Community Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
    }

    /* 密码锁屏 */
    #lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    #lock-screen .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    #lock-screen h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #f0f0f0;
    }

    #lock-screen .subtitle {
      color: #8b949e;
      margin-bottom: 32px;
      font-size: 14px;
    }

    #lock-screen .input-group {
      display: flex;
      gap: 8px;
    }

    #lock-screen input {
      padding: 12px 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      color: #f0f0f0;
      font-size: 16px;
      width: 240px;
      outline: none;
      transition: border-color 0.2s;
    }

    #lock-screen input:focus {
      border-color: #58a6ff;
    }

    #lock-screen button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #lock-screen button:hover {
      background: #2ea043;
    }

    #lock-screen .error {
      color: #f85149;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    /* 报告内容区 */
    #content {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    #content .header {
      border-bottom: 1px solid #21262d;
      padding-bottom: 24px;
      margin-bottom: 32px;
    }

    #content .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    #content .header .meta {
      color: #8b949e;
      font-size: 14px;
    }

    /* Markdown 渲染样式 */
    .markdown-body h1 { font-size: 24px; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #21262d; }
    .markdown-body h2 { font-size: 20px; margin: 28px 0 12px; color: #58a6ff; }
    .markdown-body h3 { font-size: 16px; margin: 20px 0 8px; color: #d2a8ff; }
    .markdown-body p { margin: 8px 0; line-height: 1.7; }
    .markdown-body ul, .markdown-body ol { margin: 8px 0 8px 24px; }
    .markdown-body li { margin: 4px 0; line-height: 1.6; }
    .markdown-body blockquote { 
      border-left: 3px solid #3b82f6; 
      padding: 8px 16px; 
      margin: 12px 0; 
      background: #161b22;
      border-radius: 0 6px 6px 0;
    }
    .markdown-body code { 
      background: #1f2937; 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-size: 13px; 
    }
    .markdown-body pre { 
      background: #161b22; 
      padding: 16px; 
      border-radius: 8px; 
      overflow-x: auto; 
      margin: 12px 0;
    }
    .markdown-body table { 
      width: 100%; 
      border-collapse: collapse; 
      margin: 12px 0; 
      font-size: 14px;
    }
    .markdown-body th, .markdown-body td { 
      border: 1px solid #30363d; 
      padding: 8px 12px; 
      text-align: left; 
    }
    .markdown-body th { 
      background: #161b22; 
      font-weight: 600; 
    }
    .markdown-body tr:nth-child(even) { background: #0d1117; }
    .markdown-body hr { border: none; border-top: 1px solid #21262d; margin: 24px 0; }
    .markdown-body strong { color: #f0f0f0; }
    .markdown-body a { color: #58a6ff; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }

    /* 导航 */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #21262d;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .nav .brand {
      font-weight: 600;
      color: #58a6ff;
    }

    .nav .lock-btn {
      padding: 6px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: transparent;
      color: #8b949e;
      cursor: pointer;
      font-size: 13px;
    }

    .nav .lock-btn:hover {
      border-color: #f85149;
      color: #f85149;
    }

    #content.has-nav { padding-top: 80px; }

    /* 响应式 */
    @media (max-width: 768px) {
      #content { padding: 60px 16px 24px; }
      .markdown-body table { font-size: 12px; }
      .markdown-body th, .markdown-body td { padding: 4px 6px; }
    }
  </style>
</head>
<body>
  <!-- 密码锁屏 -->
  <div id="lock-screen">
    <div class="logo">📡</div>
    <h1>RM Community Monitor</h1>
    <p class="subtitle">输入访问密码查看报告</p>
    <div class="input-group">
      <input type="password" id="pwd-input" placeholder="访问密码" autocomplete="off">
      <button onclick="unlock()">解锁</button>
    </div>
    <p class="error" id="error-msg">密码错误，请重试</p>
  </div>

  <!-- 解锁后的内容 -->
  <div id="content" class="has-nav">
    <nav class="nav">
      <span class="brand">📡 RM Community Monitor</span>
      <button class="lock-btn" onclick="lockPage()">🔒 锁定</button>
    </nav>
    <div class="header">
      <h1 id="report-title"></h1>
      <p class="meta" id="report-meta"></p>
    </div>
    <div class="markdown-body" id="report-body"></div>
  </div>

    // AES-256-CBC 解密（使用 Web Crypto API）
    async function decrypt(encryptedBase64, password) {
      const encData = JSON.parse(atob(encryptedBase64));
      const salt = Uint8Array.from(atob(encData.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(encData.iv), c => c.charCodeAt(0));
      const ciphertext = Uint8Array.from(atob(encData.ciphertext), c => c.charCodeAt(0));

      // 从密码派生密钥 (PBKDF2)
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-CBC', length: 256 },
        false,
        ['decrypt']
      );

      try {
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, ciphertext);
        return new TextDecoder().decode(decrypted);
      } catch {
        return null;
      }
    }

    // 简易 Markdown → HTML（无依赖）
    function renderMarkdown(md) {
      let html = md
        // 表格
        .replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((\|.+\|\s*\n)*)/gm, (match, header, body) => {
          const headers = header.split('|').map(h => h.trim()).filter(Boolean);
          const rows = body.trim().split('\n').map(row => 
            row.split('|').map(c => c.trim()).filter(Boolean)
          );
          let table = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
          rows.forEach(row => {
            table += '<tr>' + row.map(c => `<td>${c}</td>`).join('') + '</tr>';
          });
          return table + '</tbody></table>\n';
        })
        // Headers
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // HR
        .replace(/^---+$/gm, '<hr>')
        .replace(/^━+$/gm, '<hr>')
        // Blockquote
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Code
        .replace(/`(.+?)`/g, '<code>$1</code>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        // Lists
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Paragraphs
        .replace(/\n\n/g, '</p><p>')
        // Line breaks
        .replace(/\n/g, '<br>');
      
      // Wrap lists
      html = html.replace(/(<li>.+<\/li>(<br>)?)+/g, (match) => '<ul>' + match.replace(/<br>/g, '') + '</ul>');
      
      return '<p>' + html + '</p>';
    }

    async function unlock() {
      const pwd = document.getElementById('pwd-input').value;
      if (!pwd) return;

      const encData = document.getElementById('encrypted-data').textContent.trim();
      const decrypted = await decrypt(encData, pwd);

      if (!decrypted) {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('pwd-input').value = '';
        document.getElementById('pwd-input').focus();
        return;
      }

      // 解析内容
      const data = JSON.parse(decrypted);
      document.getElementById('report-title').textContent = data.title;
      document.getElementById('report-meta').textContent = data.meta;
      document.getElementById('report-body').innerHTML = renderMarkdown(data.body);

      // 切换视图
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      // 记住密码（sessionStorage，关标签页自动清除）
      sessionStorage.setItem('rm-pwd', pwd);
    }

    function lockPage() {
      sessionStorage.removeItem('rm-pwd');
      document.getElementById('content').style.display = 'none';
      document.getElementById('lock-screen').style.display = 'flex';
      document.getElementById('pwd-input').value = '';
      document.getElementById('error-msg').style.display = 'none';
    }

    // 回车键解锁
    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') unlock();
    });

    // 页面加载时检查 sessionStorage
    window.addEventListener('DOMContentLoaded', async () => {
      const savedPwd = sessionStorage.getItem('rm-pwd');
      if (savedPwd) {
        document.getElementById('pwd-input').value = savedPwd;
        await unlock();
      }
    });
  </script>
</body>
</html>
