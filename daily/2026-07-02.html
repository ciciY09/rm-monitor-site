  <script>
    function renderMd(md) {
      return md
        .replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((\|.+\|\s*\n)*)/gm, (m, h, b) => {
          const hs = h.split('|').map(x=>x.trim()).filter(Boolean);
          const rs = b.trim().split('\n').map(r=>r.split('|').map(x=>x.trim()).filter(Boolean));
          let t='<table><thead><tr>'+hs.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
          rs.forEach(r=>{t+='<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>';});
          return t+'</tbody></table>\n';
        })
        .replace(/^### (.+)$/gm,'<h3>$1</h3>')
        .replace(/^## (.+)$/gm,'<h2>$1</h2>')
        .replace(/^# (.+)$/gm,'<h1>$1</h1>')
        .replace(/^---+$/gm,'<hr>').replace(/^━+$/gm,'<hr>')
        .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>')
        .replace(/`(.+?)`/g,'<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
        .replace(/^- (.+)$/gm,'<li>$1</li>')
        .replace(/\n\n/g,'</p><p>')
        .replace(/\n/g,'<br>');
    }
    const data = JSON.parse(document.getElementById('report-data').textContent);
    document.getElementById('title').textContent = data.title;
    document.getElementById('meta').textContent = data.meta;
    document.getElementById('body').innerHTML = '<p>'+renderMd(data.body)+'</p>';
  </script>
